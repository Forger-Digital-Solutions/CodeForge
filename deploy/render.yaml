# CodeForge Cloud API — EXAMPLE deployment manifest (Render)
#
# THIS IS AN EXAMPLE, NOT A CERTIFIED $0 STAGING TARGET.
#
# CodeForge Cloud has exactly one canonical deployment interface:
#
#     a Docker image  +  an environment contract  +  a PostgreSQL DATABASE_URL
#
# That contract is declared once, in apps/cloud-api/src/staging-contract.ts, and is validated by
# `npm run cloud:staging:preflight`. This file is a thin platform-specific wrapper around it — one
# way to express the same contract — and nothing in CodeForge depends on this platform.
#
# Before using it, verify FOR YOURSELF that:
#   * the plans below are still free on your account today (free tiers change, and free Postgres
#     offerings in particular have carried expiry dates and no backups),
#   * the platform streams Server-Sent Events without buffering (CodeForge streams inference),
#   * the service is not suspended between requests in a way that breaks an in-flight login.
#
# Never create a billable resource for this project. If a plan below is no longer free on your
# account, use a different platform rather than upgrading.
#
# Secrets marked `sync: false` are set in the platform dashboard and are never committed here.
# See docs/cloud/STAGING_BOOTSTRAP.md for the full bootstrap, including the exact GitHub OAuth
# callback URL to register.

services:
  - type: web
    name: codeforge-cloud-api
    runtime: docker
    dockerfilePath: ./Dockerfile.cloud
    plan: free # verify this is still a free plan on your account before applying
    healthCheckPath: /health/live
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CODEFORGE_CLOUD_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      # The public HTTPS origin of THIS service. GitHub redirects to
      # `${CODEFORGE_PUBLIC_URL}/v1/auth/github/callback`, which is the URL to register in the
      # GitHub OAuth App. Set it after the service has its hostname.
      - key: CODEFORGE_PUBLIC_URL
        sync: false
      - key: CODEFORGE_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: CODEFORGE_CLOUD_DB_DRIVER
        value: postgres
      - key: CODEFORGE_CLOUD_DB_SSL
        value: "true"
      # This platform terminates TLS and forwards X-Forwarded-For. Set to "false" on a platform that
      # does not, so a client cannot spoof its own address.
      - key: CODEFORGE_TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: codeforge-cloud-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # platform-generated 32+ character secret
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY # TEST-mode key only; live keys are refused at boot
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_CREDIT_PRICE_ID
        sync: false
      - key: OPENROUTER_API_KEY # server-owned Hosted Free capacity ($0 :free routes)
        sync: false
      - key: GROQ_API_KEY # server-owned Hosted Free capacity (free allowance)
        sync: false

databases:
  - name: codeforge-cloud-db
    plan: free # verify this is still a free plan, and note any expiry, before applying
