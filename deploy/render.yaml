# CodeForge Cloud API — Render Blueprint (staging)
#
# This is a deployment-ready staging blueprint, not proof of a deployed service.
# Render's current free Postgres tier has a 30-day expiry and no backups or managed pooling.
# Confirm current plan terms, workspace allowance, and an existing zero-cost authorization before
# applying this file. Never create a billable resource for this project.
#
# Secrets marked `sync: false` are set in the Render dashboard, never committed here.
# This file is a deployment ARTIFACT — applying it requires a Render account (external).

services:
  - type: web
    name: codeforge-cloud-api
    runtime: docker
    dockerfilePath: ./Dockerfile.cloud
    plan: free
    healthCheckPath: /health/live
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CODEFORGE_CLOUD_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: CODEFORGE_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: CODEFORGE_CLOUD_DB_DRIVER
        value: postgres
      - key: CODEFORGE_CLOUD_DB_SSL
        value: "true"
      - key: CODEFORGE_TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: codeforge-cloud-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong 32+ char secret
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY # TEST-mode key only; live keys are refused at boot
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_CREDIT_PRICE_ID
        sync: false
      - key: OPENROUTER_API_KEY # server-owned Hosted Free capacity ($0 :free routes)
        sync: false
      - key: GROQ_API_KEY # server-owned Hosted Free capacity (free allowance)
        sync: false

databases:
  - name: codeforge-cloud-db
    plan: free
