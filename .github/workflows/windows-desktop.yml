# CodeForge Desktop — Windows packaging.
#
# The end-user guarantee: users NEVER need Python, MSVC, node-gyp, Docker or
# WSL. All native compilation happens here, on this CI runner, which comes
# with a full toolchain preinstalled. The produced better-sqlite3 binary
# targets Electron's bundled Node ABI and ships inside the installer.
#
# Evidence base: node:sqlite requires Node >= 22.5; Electron 33 bundles
# Node 20.18 (verified via ELECTRON_RUN_AS_NODE probe), so the packaged app
# needs the better-sqlite3 driver (packages/sessions/src/sqlite.ts falls back
# to it automatically when require("node:sqlite") fails).
name: windows-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify app-builder binary and environment
        shell: pwsh
        env:
          APP_BUILDER_TARGET: node_modules/app-builder-bin/win/x64/app-builder.exe
        run: |
          if (-not (Test-Path $env:APP_BUILDER_TARGET)) {
            Write-Host "PACKAGING_FAILED app-builder.exe missing after npm ci"
            exit 1
          }
          Unblock-File -Path $env:APP_BUILDER_TARGET -ErrorAction SilentlyContinue
          Write-Host "app-builder.exe version (direct):"
          & $env:APP_BUILDER_TARGET --version

      - name: Compile better-sqlite3 for Electron ABI (CI-only toolchain)
        run: npm run rebuild:native --workspace @codeforge/desktop

      - name: Typecheck
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Test
        run: npm test

      - name: Comprehensive app-builder.exe diagnostic
        shell: pwsh
        run: |
          Write-Host "=== COMPREHENSIVE APP-BUILDER.EXE DIAGNOSTIC ==="
          
          # Test 1: File existence and basic info
          Write-Host "`n1. File existence check:"
          $absPath = (Resolve-Path "node_modules/app-builder-bin/win/x64/app-builder.exe").Path
          Write-Host "   Absolute path: $absPath"
          Write-Host "   Exists: $(Test-Path $absPath)"
          Get-Item $absPath | Format-List FullName,Length,LastWriteTime,Attributes | Out-String | Write-Host
          
          # Test 2: Node fs.statSync
          Write-Host "`n2. Node fs.statSync test:"
          node -e "
          const fs = require('fs');
          const p = require('path').resolve('node_modules/app-builder-bin/win/x64/app-builder.exe');
          console.log('   Path:', p);
          try {
            const s = fs.statSync(p);
            console.log('   SUCCESS - isFile:', s.isFile(), 'size:', s.size);
          } catch (e) {
            console.log('   ERROR:', e.code, e.message);
          }
          "
          
          # Test 3: which.sync test
          Write-Host "`n3. which.sync test:"
          node -e "
          const which = require('which');
          const p = require('./node_modules/app-builder-bin').appBuilderPath;
          const path = require('path');
          console.log('   Path:', p);
          console.log('   Absolute:', path.isAbsolute(p));
          try {
            console.log('   which result:', which.sync(p));
          } catch (e) {
            console.log('   which ERROR:', e.code, e.message);
          }
          "
          
          # Test 4: Node direct spawn
          Write-Host "`n4. Node direct spawnSync test:"
          node -e "
          const { spawnSync } = require('child_process');
          const path = require('path');
          const p = require('./node_modules/app-builder-bin').appBuilderPath;
          console.log('   Path:', p);
          const cwd = path.resolve('apps/desktop');
          console.log('   CWD:', cwd);
          const r = spawnSync(p, ['--version'], { encoding: 'utf8', cwd: cwd });
          console.log('   Status:', r.status);
          console.log('   Stdout:', r.stdout ? r.stdout.trim() : '(empty)');
          console.log('   Stderr:', r.stderr ? r.stderr.trim() : '(empty)');
          if (r.error) console.log('   Error:', r.error.message);
          "
          
          # Test 5: cross-spawn._parse analysis
          Write-Host "`n5. cross-spawn._parse test:"
          node -e "
          const cs = require('cross-spawn');
          const p = require('./node_modules/app-builder-bin').appBuilderPath;
          const path = require('path');
          console.log('   Path:', p);
          const cwd = path.resolve('apps/desktop');
          console.log('   CWD:', cwd);
          const parsed = cs._parse(p, ['--version'], { cwd: cwd });
          console.log('   Parsed command:', parsed.command);
          console.log('   Parsed file:', parsed.file);
          console.log('   Parsed args:', parsed.args);
          "
          
          # Test 6: cross-spawn.sync test
          Write-Host "`n6. cross-spawn.sync test:"
          node -e "
          const cs = require('cross-spawn');
          const p = require('./node_modules/app-builder-bin').appBuilderPath;
          const path = require('path');
          console.log('   Path:', p);
          const cwd = path.resolve('apps/desktop');
          console.log('   CWD:', cwd);
          try {
            const r = cs.sync(p, ['--version'], { encoding: 'utf8', cwd: cwd });
            console.log('   Status:', r.status);
            console.log('   Stdout:', r.stdout ? r.stdout.trim() : '(empty)');
            console.log('   Stderr:', r.stderr ? r.stderr.trim() : '(empty)');
            if (r.error) console.log('   Error:', r.error.message);
          } catch (e) {
            console.log('   cross-spawn ERROR:', e.code, e.message);
          }
          "
          
          # Test 7: Dependency versions
          Write-Host "`n7. Dependency versions:"
          node -e "
          const packages = [
            'cross-spawn',
            'which',
            'isexe',
            'app-builder-bin',
            'builder-util',
            'app-builder-lib',
            'electron-builder'
          ];
          for (const pkg of packages) {
            try {
              const version = require(pkg + '/package.json').version;
              console.log('   ' + pkg + ':', version);
            } catch (e) {
              console.log('   ' + pkg + ': NOT FOUND');
            }
          }
          "
          
          # Test 8: Resolve paths
          Write-Host "`n8. Resolve paths:"
          node -e "
          console.log('   cross-spawn:', require.resolve('cross-spawn'));
          console.log('   which:', require.resolve('which'));
          console.log('   isexe:', require.resolve('isexe'));
          "
          
          Write-Host "`n=== DIAGNOSTIC COMPLETE ==="

      - name: Package (NSIS installer + portable)
        shell: pwsh
        run: |
          Write-Host "Pre-package check:"
          Write-Host "app-builder-bin path:"
          Get-Item "node_modules/app-builder-bin/win/x64/app-builder.exe" -ErrorAction SilentlyContinue | Select-Object FullName, Length, LastWriteTime
          if (-not (Test-Path "node_modules/app-builder-bin/win/x64/app-builder.exe")) {
            Write-Host "PACKAGING_FAILED app-builder.exe missing before electron-builder"
            exit 1
          }
          npm run dist --workspace @codeforge/desktop

      - name: Verify packaged bundle ships the Electron-ABI SQLite binding
        shell: pwsh
        run: |
          $bindingFiles = Get-ChildItem -Path "apps/desktop/release/win-unpacked" -Recurse -Filter "better_sqlite3.node" -ErrorAction SilentlyContinue
          if (-not $bindingFiles -or @($bindingFiles).Count -lt 1) {
            Write-Host "PACKAGING_FAILED better_sqlite3.node missing from win-unpacked"
            exit 1
          }
          Write-Host "packaged_native_binding=$(@($bindingFiles)[0].FullName)"

      - name: Persistence smoke check inside packaged runtime
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:CODEFORGE_SMOKE_OUT = Join-Path $env:GITHUB_WORKSPACE "packaged-persistence-result.log"
          & "apps/desktop/release/win-unpacked/CodeForge.exe" scripts/verify-packaged-persistence.cjs
          $smokeExitCode = $LASTEXITCODE
          if (Test-Path $env:CODEFORGE_SMOKE_OUT) {
            Write-Host "--- packaged persistence evidence ---"
            Get-Content $env:CODEFORGE_SMOKE_OUT
            Write-Host "--- end evidence ---"
          }
          Write-Host "smoke_exit_code=$smokeExitCode"
          exit $smokeExitCode

      - name: Verify artifacts exist before upload
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path "apps/desktop/release" -File -ErrorAction SilentlyContinue
          if (-not $artifacts) {
            Write-Host "PACKAGING_FAILED no artifacts found in apps/desktop/release"
            exit 1
          }
          Write-Host "Found artifacts:"
          $artifacts | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-windows-installers
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
