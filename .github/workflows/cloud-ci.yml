# CodeForge Cloud — CI for the hosted platform (apps/cloud-api + cloud-* packages).
#
# The default job is fully DETERMINISTIC and requires NO secrets: it typechecks, builds, and runs the
# cloud-critical suites (unit, adversarial security, concurrency ledger, failure matrix, provider
# registry, config, and every launch-invariant certification) plus the full test run. Real
# provider/staging smokes are separate manual, secret-gated jobs so pull requests never need real
# credentials.
name: cloud-ci

on:
  workflow_dispatch:
  push:
    branches: ["master", "main", "feat/codeforge-cloud"]
    paths:
      - "apps/cloud-api/**"
      - "apps/desktop/src/cloud-**"
      - "apps/desktop/test/cloud-**"
      - "apps/desktop/cloud-endpoints.json"
      - "packages/cloud-*/**"
      - "packages/forge-zero/**"
      - "packages/router/**"
      - "packages/providers/**"
      - "packages/model-registry/**"
      - "packages/workflow/**"
      - "scripts/cloud/**"
      - "tests/**"
      - ".github/workflows/cloud-ci.yml"
  pull_request:
    paths:
      - "apps/cloud-api/**"
      - "apps/desktop/src/cloud-**"
      - "apps/desktop/test/cloud-**"
      - "apps/desktop/cloud-endpoints.json"
      - "packages/cloud-*/**"
      - "packages/forge-zero/**"
      - "packages/router/**"
      - "packages/providers/**"
      - "packages/model-registry/**"
      - "packages/workflow/**"
      - "scripts/cloud/**"
      - "tests/**"

jobs:
  cloud-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: codeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CODEFORGE_TEST_POSTGRES_URL: postgresql://postgres:postgrespassword@localhost:5432/codeforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # node:sqlite (>= 22.5) is the cloud DB driver
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

      # Every guarantee this phase closed, run explicitly so a regression names itself rather than
      # disappearing into a bulk run.
      - name: OAuth architecture, redirect hardening, and replay protection
        run: npx vitest run packages/cloud-auth

      - name: Staging tooling (config contract, preflight, remote probe, receipt schema)
        run: npx vitest run apps/cloud-api/test/staging-tooling.test.ts

      - name: Desktop Cloud endpoint control
        run: npx vitest run apps/desktop/test/cloud-endpoint.test.ts

      - name: Production identity-bypass guard
        run: npx vitest run tests/production-auth-bypass-guard.test.ts

      - name: Direct/BYOK independence during Cloud outage
        run: npx vitest run tests/direct-byok-cloud-outage.test.ts

      - name: Two-client server authority (SQLite + real PostgreSQL)
        run: npx vitest run tests/two-client-authority.test.ts

      - name: Reservation-before-provider ordering
        run: npx vitest run tests/reservation-ordering.test.ts

      - name: Exact-model contract end to end
        run: npx vitest run tests/exact-model-contract.test.ts

      - name: GEMS identity firewall
        run: npx vitest run tests/gems-identity-firewall.test.ts

      - name: Local reverse-proxy SSE certification
        run: npx vitest run tests/reverse-proxy-sse.test.ts

      - name: Cloud-critical suites (SQLite + Real PostgreSQL)
        run: >-
          npx vitest run
          apps/cloud-api
          packages/cloud-db
          packages/cloud-usage
          packages/cloud-gateway
          tests/cloud-adversarial-security.test.ts
          tests/cloud-concurrency-ledger.test.ts
          tests/cloud-failure-matrix.test.ts
          tests/cloud-postgres-adversarial.test.ts

      - name: Full test suite
        run: npm test

      # The launch tooling must run, not merely compile. These invocations assert the tools behave
      # correctly on an INCOMPLETE environment — the state every deployment starts from.
      - name: Staging preflight fails closed on an incomplete environment
        run: |
          set +e
          npm run cloud:staging:preflight
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::staging preflight passed with no staging configuration present"
            exit 1
          fi
          echo "staging preflight correctly returned non-zero ($code) for an incomplete environment"

      - name: Launch checklist reports remaining external actions
        run: |
          set +e
          npm run cloud:launch:checklist
          code=$?
          set -e
          echo "launch checklist reported $code unresolved item(s)"

      - name: PostgreSQL deployment validation against the CI database
        run: npm run cloud:pg:validate -- --url "$CODEFORGE_TEST_POSTGRES_URL"

  # Builds the deployment image and proves it actually boots and serves against real PostgreSQL.
  # No secrets: the image is exercised with throwaway staging-shaped configuration.
  docker-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the Cloud image
        run: docker build -f Dockerfile.cloud -t codeforge-cloud-api:ci .

      # PostgreSQL with real TLS, because that is what a staging deployment actually uses: the Cloud
      # REFUSES to boot in staging/production against a non-loopback database without
      # certificate-validated TLS. Running this job without TLS would exercise a configuration the
      # product deliberately rejects.
      - name: Start PostgreSQL with TLS
        run: |
          mkdir -p pgtls
          openssl req -new -x509 -days 1 -nodes -newkey rsa:2048 \
            -keyout pgtls/ca.key -out pgtls/ca.crt -subj "/CN=CodeForge CI CA"
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout pgtls/server.key -out pgtls/server.csr -subj "/CN=codeforge-ci-pg"
          echo "subjectAltName=DNS:codeforge-ci-pg" > pgtls/san.ext
          openssl x509 -req -in pgtls/server.csr -CA pgtls/ca.crt -CAkey pgtls/ca.key \
            -CAcreateserial -out pgtls/server.crt -days 1 -sha256 -extfile pgtls/san.ext

          docker network create codeforge-ci-net
          docker run -d --name codeforge-ci-pg --network codeforge-ci-net \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=cipassword -e POSTGRES_DB=codeforge_ci \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec codeforge-ci-pg pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done

          docker cp pgtls/server.crt codeforge-ci-pg:/var/lib/postgresql/server.crt
          docker cp pgtls/server.key codeforge-ci-pg:/var/lib/postgresql/server.key
          docker exec -u root codeforge-ci-pg sh -c 'chown postgres:postgres /var/lib/postgresql/server.key /var/lib/postgresql/server.crt && chmod 600 /var/lib/postgresql/server.key'
          docker exec -u postgres codeforge-ci-pg sh -c "cat >> /var/lib/postgresql/data/postgresql.conf <<'PGCONF'
          ssl = on
          ssl_cert_file = '/var/lib/postgresql/server.crt'
          ssl_key_file = '/var/lib/postgresql/server.key'
          PGCONF"
          docker restart codeforge-ci-pg
          for i in $(seq 1 30); do
            if docker exec codeforge-ci-pg pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec codeforge-ci-pg psql -U postgres -d codeforge_ci -c 'SHOW ssl;'

      - name: Run the Cloud container against real PostgreSQL
        run: |
          docker run -d --name codeforge-ci-api --network codeforge-ci-net -p 3220:3220 \
            -v "$PWD/pgtls/ca.crt:/etc/ssl/certs/codeforge-ci-ca.crt:ro" \
            -e NODE_EXTRA_CA_CERTS=/etc/ssl/certs/codeforge-ci-ca.crt \
            -e NODE_ENV=production \
            -e CODEFORGE_CLOUD_ENV=staging \
            -e CODEFORGE_PUBLIC_URL=https://codeforge-ci.example.com \
            -e HOST=0.0.0.0 -e PORT=3220 \
            -e CODEFORGE_TRUST_PROXY=true \
            -e CODEFORGE_CLOUD_DB_DRIVER=postgres \
            -e DATABASE_URL="postgresql://postgres:cipassword@codeforge-ci-pg:5432/codeforge_ci?sslmode=require" \
            -e CODEFORGE_CLOUD_DB_SSL=true \
            -e JWT_SECRET="codeforge-ci-throwaway-signing-secret-0123456789" \
            -e GITHUB_CLIENT_ID="Iv1.codeforgeci" \
            -e GITHUB_CLIENT_SECRET="codeforge-ci-throwaway-client-secret" \
            -e STRIPE_SECRET_KEY="sk_test_codeforge_ci" \
            -e STRIPE_WEBHOOK_SECRET="whsec_codeforge_ci" \
            codeforge-cloud-api:ci

          # Fail HERE if the container never becomes ready, rather than letting the probe report a
          # confusing connection-refused several steps later.
          ready=""
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3220/health/live >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          docker logs codeforge-ci-api
          if [ -z "$ready" ]; then
            echo "::error::the Cloud container never became ready"
            exit 1
          fi

      - name: Remote probe against the running container
        run: |
          npm ci --no-audit --no-fund
          # `npm run build --workspaces` is not dependency-aware, so compile the TypeScript project
          # graph first (the same ordering Dockerfile.cloud relies on).
          npx tsc -b
          npm run build
          npm run cloud:remote:probe -- --url http://127.0.0.1:3220 --allow-insecure --json remote-probe.json

      - name: Upload probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-runtime-probe
          path: remote-probe.json
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: |
          docker rm -f codeforge-ci-api codeforge-ci-pg || true
          docker network rm codeforge-ci-net || true

  # Manual only, and each step self-skips when its credential secret is absent. Never runs on PRs.
  real-staging-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Real hosted inference smoke (free-safe, $0)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "No free-safe provider secret configured — skipping real smoke."
            exit 0
          fi
          node scripts/cloud/real-hosted-smoke.mjs
