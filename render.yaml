# CodeForge Cloud API — Render Free staging Blueprint.
#
# This creates only the public Docker runtime. Persistent PostgreSQL is supplied separately through
# the encrypted DATABASE_URL field; no database is provisioned by this Blueprint.
services:
  - type: web
    name: codeforge-cloud-staging
    runtime: docker
    repo: https://github.com/Forger-Digital-Solutions/CodeForge.git
    branch: codeforge/adaptive-intelligence-r1
    dockerfilePath: ./Dockerfile.cloud
    plan: free
    healthCheckPath: /health/live
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CODEFORGE_CLOUD_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: CODEFORGE_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: CODEFORGE_CLOUD_DB_DRIVER
        value: postgres
      - key: CODEFORGE_CLOUD_DB_SSL
        value: "true"
      # Docker image extends Node's trust store with the public Supabase Root 2021 CA.
      # PostgreSQL certificate verification remains enabled.
      - key: CODEFORGE_TRUST_PROXY
        value: "true"
      - key: CODEFORGE_HOSTED_INFERENCE_ENABLED
        value: "true"
      - key: CODEFORGE_HOSTED_FREE_ENABLED
        value: "true"
      # The server uses Render's runtime-assigned RENDER_EXTERNAL_URL until a custom public
      # origin is deliberately configured. No hostname is predicted during Blueprint creation.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # At least one CodeForge-owned managed-free credential is required before Hosted Free is ready.
      # Personal/BYOK provider variables intentionally do not satisfy this contract.
      - key: CODEFORGE_GROQ_API_KEY
        sync: false
      - key: CODEFORGE_GROQ_FREE_PLAN_ONLY
        value: "true"
