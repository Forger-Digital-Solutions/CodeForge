# CodeForge Cloud API — Render Free staging Blueprint.
#
# This creates only the public Docker runtime. Persistent PostgreSQL is supplied separately by
# Neon or Supabase through the encrypted DATABASE_URL field; no short-lived Render database is
# provisioned by this Blueprint.
services:
  - type: web
    name: codeforge-cloud-staging
    runtime: docker
    repo: https://github.com/Forger-Digital-Solutions/CodeForge.git
    branch: feat/codeforge-cloud
    dockerfilePath: ./Dockerfile.cloud
    plan: free
    healthCheckPath: /health/live
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CODEFORGE_CLOUD_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: CODEFORGE_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: CODEFORGE_CLOUD_DB_DRIVER
        value: postgres
      - key: CODEFORGE_CLOUD_DB_SSL
        value: "true"
      # Keep Node's standard trust store and add the Supabase CA from Render's secret file.
      - key: NODE_EXTRA_CA_CERTS
        value: /etc/secrets/prod-ca-2021.crt
      - key: CODEFORGE_TRUST_PROXY
        value: "true"
      # The server uses Render's runtime-assigned RENDER_EXTERNAL_URL until a custom public
      # origin is deliberately configured. No hostname is predicted during Blueprint creation.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # At least one server-owned provider credential is required before Hosted Free is ready.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
