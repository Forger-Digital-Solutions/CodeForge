# CodeForge Cloud API — Render Free staging Blueprint.
#
# This creates only the public Docker runtime. Persistent PostgreSQL is supplied separately by
# Neon or Supabase through the encrypted DATABASE_URL field; no short-lived Render database is
# provisioned by this Blueprint.
services:
  - type: web
    name: codeforge-cloud-staging
    runtime: docker
    repo: https://github.com/Forger-Digital-Solutions/CodeForge.git
    branch: feat/codeforge-cloud
    dockerfilePath: ./Dockerfile.cloud
    plan: free
    healthCheckPath: /health/live
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CODEFORGE_CLOUD_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: CODEFORGE_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: CODEFORGE_CLOUD_DB_DRIVER
        value: postgres
      - key: CODEFORGE_CLOUD_DB_SSL
        value: "true"
      # Docker image extends Node's trust store with the public Supabase Root 2021 CA.
      # PostgreSQL certificate verification remains enabled.
      - key: CODEFORGE_TRUST_PROXY
        value: "true"
      # The server uses Render's runtime-assigned RENDER_EXTERNAL_URL until a custom public
      # origin is deliberately configured. No hostname is predicted during Blueprint creation.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Security R1: versioned key ring that wraps per-record data keys for secrets sealed at rest
      # (see docs/security/key-management-and-rotation.md). Render generates an opaque random
      # value; the Cloud stretches it with HKDF-SHA256 into a 256-bit KEK (version 1). Rotations
      # replace this with an explicit "2:<base64>,1:<base64>" ring. Boot fails without it.
      - key: CODEFORGE_DATA_ENCRYPTION_KEYS
        generateValue: true
      # RFC 9116 security.txt is served only when a real contact is configured (mailto: or https://).
      # Left unset until the owner supplies one — CodeForge never publishes a placeholder contact.
      - key: CODEFORGE_SECURITY_CONTACT
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # At least one server-owned provider credential is required before Hosted Free is ready.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
